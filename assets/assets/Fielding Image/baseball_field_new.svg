<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund -->
  <rect width="800" height="600" fill="#3a7d44" />
  
  <!-- Outfield mit Farbverlauf -->
  <path d="M 400,400 A 350,350 0 0,1 50,400 L 50,50 L 750,50 L 750,400 A 350,350 0 0,1 400,400 Z" fill="#4c9f58" />
  
  <!-- Warnlaufbahn (Warning Track) -->
  <path d="M 400,400 A 350,350 0 0,1 50,400 L 50,50 L 750,50 L 750,400 A 350,350 0 0,1 400,400 Z" 
        stroke="#bb7f5c" stroke-width="20" fill="none" />
  
  <!-- Outfield Wall -->
  <path d="M 400,400 A 370,370 0 0,1 30,400 L 30,30 L 770,30 L 770,400 A 370,370 0 0,1 400,400 Z" 
        stroke="#27632f" stroke-width="4" fill="none" />
        
  <!-- Outfield Linien -->
  <line x1="400" y1="400" x2="150" y2="120" stroke="white" stroke-width="2" stroke-dasharray="5,5" />
  <line x1="400" y1="400" x2="650" y2="120" stroke="white" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Infield Dirt -->
  <path d="M 400,400 L 250,250 L 400,100 L 550,250 Z" fill="#c6936b" stroke="#d9a87e" stroke-width="2" />
  
  <!-- Extended Infield Dirt (um Home Plate und zu den Bases) -->
  <path d="M 400,400 L 250,250 L 400,100 L 550,250 Z" fill="#c6936b" stroke="none" />
  <path d="M 400,400 L 300,550 L 500,550 Z" fill="#c6936b" stroke="none" />
  <path d="M 400,400 L 250,250 L 100,300 L 200,450 Z" fill="#c6936b" stroke="none" />
  <path d="M 400,400 L 550,250 L 700,300 L 600,450 Z" fill="#c6936b" stroke="none" />
  
  <!-- Baselines -->
  <line x1="400" y1="400" x2="550" y2="250" stroke="white" stroke-width="3" />
  <line x1="400" y1="400" x2="250" y2="250" stroke="white" stroke-width="3" />
  <line x1="250" y1="250" x2="400" y2="100" stroke="white" stroke-width="3" />
  <line x1="400" y1="100" x2="550" y2="250" stroke="white" stroke-width="3" />
  
  <!-- Home Plate -->
  <polygon points="400,400 390,410 400,420 410,410" fill="white" stroke="black" stroke-width="1" />
  
  <!-- Bases -->
  <!-- First Base -->
  <rect x="535" y="235" width="30" height="30" transform="rotate(45, 550, 250)" fill="white" stroke="#666" stroke-width="1" />
  
  <!-- Second Base -->
  <rect x="385" y="85" width="30" height="30" transform="rotate(45, 400, 100)" fill="white" stroke="#666" stroke-width="1" />
  
  <!-- Third Base -->
  <rect x="235" y="235" width="30" height="30" transform="rotate(45, 250, 250)" fill="white" stroke="#666" stroke-width="1" />
  
  <!-- Pitcher's Mound -->
  <circle cx="400" cy="270" r="25" fill="#b88a66" stroke="#d9a87e" stroke-width="2" />
  <circle cx="400" cy="270" r="5" fill="white" />
  
  <!-- Batter's Box -->
  <rect x="380" y="410" width="40" height="60" stroke="white" stroke-width="2" fill="none" />
  
  <!-- Catcher's Box -->
  <rect x="375" y="480" width="50" height="30" stroke="white" stroke-width="1" fill="none" />
  
  <!-- On-Deck Circles -->
  <circle cx="300" cy="480" r="15" fill="none" stroke="white" stroke-width="1" />
  <circle cx="500" cy="480" r="15" fill="none" stroke="white" stroke-width="1" />
  
  <!-- Grass Texture Detail (Mählinien) für das Outfield -->
  <path d="M 100,100 A 300,300 0 0,1 700,100" stroke="#49904f" stroke-width="8" fill="none" stroke-opacity="0.4" />
  <path d="M 120,150 A 280,280 0 0,1 680,150" stroke="#49904f" stroke-width="8" fill="none" stroke-opacity="0.4" />
  <path d="M 140,200 A 260,260 0 0,1 660,200" stroke="#49904f" stroke-width="8" fill="none" stroke-opacity="0.4" />
  <path d="M 160,250 A 240,240 0 0,1 640,250" stroke="#49904f" stroke-width="8" fill="none" stroke-opacity="0.4" />
  <path d="M 180,300 A 220,220 0 0,1 620,300" stroke="#49904f" stroke-width="8" fill="none" stroke-opacity="0.4" />
  <path d="M 200,350 A 200,200 0 0,1 600,350" stroke="#49904f" stroke-width="8" fill="none" stroke-opacity="0.4" />
  
  <!-- Foul Poles -->
  <line x1="150" y1="120" x2="150" y2="70" stroke="#FFD700" stroke-width="3" />
  <line x1="650" y1="120" x2="650" y2="70" stroke="#FFD700" stroke-width="3" />
  
  <!-- Foul Lines Extension -->
  <line x1="400" y1="400" x2="150" y2="120" stroke="white" stroke-width="2" />
  <line x1="400" y1="400" x2="650" y2="120" stroke="white" stroke-width="2" />
  <line x1="150" y1="120" x2="100" y2="60" stroke="white" stroke-width="2" />
  <line x1="650" y1="120" x2="700" y2="60" stroke="white" stroke-width="2" />
</svg>